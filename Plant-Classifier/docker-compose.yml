version: '3.8'

services:
  plant-classifier:
    build:
      context: .
      dockerfile: Dockerfile.fullstack
    ports:
      - "80:80"
      - "8080:8080"
    env_file:
      - .env
    restart: unless-stopped
    container_name: plant-classifier-fullstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s